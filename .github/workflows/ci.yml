name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]   # oldest supported and newest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Ruff
        run: pipx run --spec ruff==0.16.8 ruff check sitebaseline/ tests/

      - name: Unit tests (standard library only, network limited to 127.0.0.1)
        run: python -m unittest discover -s tests -v

      - name: Install and smoke-test the CLI
        run: |
          python -m pip install --no-deps .
          site-baseline --version
